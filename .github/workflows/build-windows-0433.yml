name: Build Windows 0.4.43

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 0.4.43 portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: source/windows/requirements-build.txt
      - name: Install dependencies
        working-directory: source/windows
        run: python -m pip install -r requirements-build.txt
      - name: Apply Windows 0.4.43 fix
        run: python tools/fix_windows_nas_sync_0443.py
      - name: Update release-version test
        shell: pwsh
        working-directory: source/windows
        run: |
          $p = "tests/test_standard_catalog.py"
          $s = Get-Content -Raw -Encoding UTF8 $p
          $s = $s.Replace("self.assertEqual(VERSION, '0.4.35')", "self.assertEqual(VERSION, '0.4.43')")
          Set-Content -Path $p -Value $s -Encoding UTF8
      - name: Run tests
        working-directory: source/windows
        run: python -m unittest discover -s tests -v
      - name: Build EXE
        shell: cmd
        working-directory: source/windows
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --collect-submodules "reportlab.graphics.barcode"
          --hidden-import "reportlab.graphics.barcode.code93"
          --name "PZ_REVIZE_WINDOWS_0.4.43"
          --icon "pzrevize\resources\pz_revize.ico"
          --add-data "pzrevize\resources;pzrevize\resources"
          app.py
      - name: Create portable ZIP
        shell: pwsh
        working-directory: source/windows
        run: Compress-Archive -Path "dist/PZ_REVIZE_WINDOWS_0.4.43/*" -DestinationPath "PZ_REVIZE_WINDOWS_0.4.43_PORTABLE.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PZ_REVIZE_WINDOWS_0.4.43_PORTABLE
          path: source/windows/PZ_REVIZE_WINDOWS_0.4.43_PORTABLE.zip
          if-no-files-found: error

name: Build Windows SYNC 1.0
on:
  push:
    branches: [sync-v1-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        working-directory: source/windows
        run: python -m pip install -r requirements-build.txt
      - name: Compile sync module
        working-directory: source/windows
        run: python -m py_compile pzrevize/nas_sync.py pzrevize/sync_v1.py
      - name: Tests
        working-directory: source/windows
        run: python -m unittest discover -s tests -v
      - name: Build
        shell: cmd
        working-directory: source/windows
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --collect-submodules "reportlab.graphics.barcode" --hidden-import "reportlab.graphics.barcode.code93" --name "PZ_REVIZE_WINDOWS_SYNC_1.0" --icon "pzrevize\resources\pz_revize.ico" --add-data "pzrevize\resources;pzrevize\resources" app.py
      - name: Zip
        shell: pwsh
        working-directory: source/windows
        run: Compress-Archive -Path "dist/PZ_REVIZE_WINDOWS_SYNC_1.0/*" -DestinationPath "PZ_REVIZE_WINDOWS_SYNC_1.0_PORTABLE.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PZ_REVIZE_WINDOWS_SYNC_1.0_PORTABLE
          path: source/windows/PZ_REVIZE_WINDOWS_SYNC_1.0_PORTABLE.zip

name: Build PZ-REVIZE Android 0.5.5

on:
  push:
    branches: [android-0.5.5-windows-style]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android 0.5.5 tablet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-0.5.5-windows-style
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/nas
          mkdir -p source/nas
          unzip -q PZ_REVIZE_NAS_SERVER_1.0.2_SOURCE.zip -d source/nas
          cat tools/final_fix.patch.gz.b64.part.* > /tmp/final_fix.b64
          python - <<'PY'
          import base64,gzip,pathlib
          raw=base64.b64decode(pathlib.Path('/tmp/final_fix.b64').read_bytes())
          pathlib.Path('/tmp/final_fix.patch').write_bytes(gzip.decompress(raw))
          PY
          git apply --check /tmp/final_fix.patch
          git apply /tmp/final_fix.patch
          python tools/apply_android_054b.py
          python tools/fix_android_054_compile.py
          python tools/apply_android_055.py
      - name: Build APK
        working-directory: source/android
        run: gradle --no-daemon clean assembleDebug
      - name: Name APK
        working-directory: source/android
        run: cp app/build/outputs/apk/debug/app-debug.apk PZ_REVIZE_MOBILE_0.5.5_TABLET_DEBUG.apk
      - name: Pack source
        shell: bash
        run: |
          find source/android -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find source/android -type f -name '*.pyc' -delete || true
          (cd source/android && zip -qr ../../PZ_REVIZE_ANDROID_0.5.5_SOURCE.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: PZ_REVIZE_MOBILE_0.5.5_TABLET_DEBUG
          path: source/android/PZ_REVIZE_MOBILE_0.5.5_TABLET_DEBUG.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PZ_REVIZE_ANDROID_0.5.5_SOURCE
          path: PZ_REVIZE_ANDROID_0.5.5_SOURCE.zip
          if-no-files-found: error

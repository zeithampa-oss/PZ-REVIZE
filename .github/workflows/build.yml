name: Extract PZ-REVIZE sources

on:
  push:
    branches: [fix/tablet-vv-sync-numbering]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tablet-vv-sync-numbering
      - name: Extract source archives into branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -d source/android ] && [ -d source/windows ]; then
            echo "Sources already extracted."
            exit 0
          fi
          rm -rf source
          mkdir -p source/android source/windows
          unzip -q PZ_REVIZE_ANDROID_0.5.1_TABLET_SOURCE.zip -d source/android
          cat PZ_REVIZE_WINDOWS_0.4.35_SOURCE.part.* > /tmp/PZ_REVIZE_WINDOWS_SOURCE.zip
          unzip -q /tmp/PZ_REVIZE_WINDOWS_SOURCE.zip -d source/windows
          find source -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find source -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-shm' -o -name '*.db-wal' \) -delete || true
      - name: Commit extracted sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Rozbalení zdrojů pro opravy tabletu, VV a synchronizace"
            git push origin HEAD:fix/tablet-vv-sync-numbering
          fi
